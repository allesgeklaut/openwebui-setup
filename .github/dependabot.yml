version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "ghcr.io/open-webui/open-webui"
      - dependency-name: "ghcr.io/open-webui/mcpo"
      - dependency-name: "ghcr.io/open-webui/open-terminal"
  - package-ecosystem: "npm"
    directory: "/mcpo/npm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/mcpo"
    schedule:
      interval: "weekly"
