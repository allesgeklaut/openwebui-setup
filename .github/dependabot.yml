version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "ghcr.io/open-webui/open-webui"
      - dependency-name: "ghcr.io/open-webui/mcpo"
      - dependency-name: "ghcr.io/open-webui/open-terminal"
  - package-ecosystem: "npm"
    directory: "/mcpo/npm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/mcpo"
    schedule:
      interval: "weekly"
  # Audiobookshelf MCP: uv.lock + pyproject.toml. `uv` is a supported
  # Dependabot ecosystem; review PRs manually (no automerge).
  - package-ecosystem: "uv"
    directory: "/audiobookshelf-mcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/audiobookshelf-mcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
