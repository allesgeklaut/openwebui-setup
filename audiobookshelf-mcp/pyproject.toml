[project]
name = "audiobookshelf-mcp"
version = "0.1.0"
description = "Minimal read-only Audiobookshelf MCP server over authenticated Streamable HTTP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
    "pydantic==2.14.1",
]

[project.scripts]
audiobookshelf-mcp = "audiobookshelf_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobookshelf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
