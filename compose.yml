services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    env_file:
      - /opt/secrets/webui.env
    environment:
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - WEBUI_NAME=Johannes AI
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - TZ=Europe/Vienna
      # Open Terminal auto-connect (full value incl. api_key loaded from env_file)
      # Tika for document extraction
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      # The tika image is Apache Tika 4.x. Open WebUI's default is 3, which
      # makes TikaLoader call /tika/text but parse the plain-text reply as JSON,
      # so binary/PDF URL fetches fail. Version 4 uses /tika/json/md.
      - TIKA_SERVER_VERSION=4
      # Send X-OpenWebUI-User-Id to OpenAI-compatible endpoints (litellm), so
      # the OpenCode Go session-header callback can fingerprint per user
      - ENABLE_FORWARD_USER_INFO_HEADERS=True
      # SSO
      - OAUTH_PROVIDER_NAME=Cloudflare
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI}
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      # Image generation (ComfyUI)
      - ENABLE_IMAGE_GENERATION=${ENABLE_IMAGE_GENERATION}
      - IMAGE_GENERATION_ENGINE=${IMAGE_GENERATION_ENGINE}
      - COMFYUI_BASE_URL=${COMFYUI_BASE_URL}
      # Voice chat TTS/STT and RAG embeddings: Mistral Voxtral TTS, Voxtral
      # transcription, and Mistral Embed — all routed through litellm, the
      # same gateway as chat. The *_API_KEY env vars are deliberately unset:
      # Open WebUI falls back to OPENAI_API_KEY (the litellm master key,
      # injected by the entrypoint wrapper below) for all three.
      # NOTE: these are ConfigVars — on an existing install the webui.db
      # values win over env on restart. The DB rows were updated in place
      # alongside this change (see README "Audio & RAG embeddings").
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - AUDIO_TTS_MODEL=voxtral-tts
      # Voice for voxtral-tts: "auto" routes by language (German -> Jo,
      # anything else -> Jane) via the VoxtralVoiceAlias callback in the
      # litellm stack. Readable names also work there: jo, de, jane, en,
      # paul/oliver/marie + moods (jane-sarcasm, paul-cheerful, ...), or
      # any Mistral Studio voice UUID / OpenAI alias.
      - AUDIO_TTS_VOICE=auto
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - AUDIO_STT_MODEL=voxtral-stt
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=mistral-embed
      - RAG_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      # Shared entrypoint wrapper: reads the LiteLLM key file and exports it
      # as OPENAI_API_KEY (open-webui has no _FILE support). Mounted below.
      - APP_KEY_FILE=/run/secrets/litellm.key
      - APP_KEY_ENV=OPENAI_API_KEY
      # One import root for all repo-managed extension packages.
      - PYTHONPATH=/app/backend/extensions:/app/backend
    volumes:
      - /opt/stacks/webui/data:/app/backend/data
      # Mount trusted extensions read-only; registration/activation stays explicit.
      - ./openwebui-extensions:/app/backend/extensions:ro
      # Single source of truth for the LiteLLM API key — /opt/secrets/litellm.key.
      # Injected as OPENAI_API_KEY by the shared entrypoint wrapper, so the key
      # is not duplicated into any env file.
      - /opt/secrets/litellm.key:/run/secrets/litellm.key:ro
      - /opt/stacks/entrypoint.sh:/run/entrypoint.sh:ro
    # Wrap start.sh with the shared key wrapper. Compose sets Cmd to null
    # when entrypoint is overridden, so the wrapper's args must be explicit
    # in command: instead of relying on the image's CMD.
    command:
      - /bin/sh
      - /run/entrypoint.sh
      - bash
      - start.sh
    depends_on:
      - open-terminal
      - tika
      - mcpo
      - searxng
      - research-search

  # Optional Mistral Web Scout backend for SearXNG's !scout engine.
  # Also provides /fetch for Open WebUI's external-loader option.
  # Current defaults are SearXNG search + Open WebUI's direct HTTP loader.
  research-search:
    build: ./research-search
    image: research-search:local
    container_name: research-search
    restart: unless-stopped
    environment:
      # Same single source of truth as the litellm stack: the env-style key
      # file is parsed for MISTRAL_API_KEY= at startup.
      - MISTRAL_API_KEY_FILE=/run/secrets/mistral.env
      - RESEARCH_TOKEN_FILE=/run/secrets/research-search.token
      - SCOUT_AGENT_ID=${SCOUT_AGENT_ID}
      - PORT=8080
      # Per-request fetch parallelism when the external loader is selected.
      - FETCH_WORKERS=8
    volumes:
      - /opt/secrets/mistral.env:/run/secrets/mistral.env:ro
      - /opt/secrets/research-search.token:/run/secrets/research-search.token:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional ComfyUI-protocol bridge to RunPod serverless generation/editing.
  # Local ComfyUI serves both by default.
  runpod-bridge:
    build: ./runpod-bridge
    image: runpod-bridge:local
    container_name: runpod-bridge
    restart: unless-stopped
    # Opt-in service: only starts with `docker compose --profile runpod up -d`.
    profiles:
      - runpod
    environment:
      - RUNPOD_ENDPOINT_ID=${RUNPOD_ENDPOINT_ID}
      # Optional: dedicated endpoint for edit jobs (falls back to the above)
      - RUNPOD_ENDPOINT_ID_EDIT=${RUNPOD_ENDPOINT_ID_EDIT:-}
      - BRIDGE_MODELS=flux1-dev-fp8.safetensors
      - RUNPOD_POLL_INTERVAL=3
      - RUNPOD_POLL_TIMEOUT=900
    volumes:
      - /opt/secrets/runpod.key:/run/secrets/runpod.key:ro
    command:
      - /bin/sh
      - -c
      - |
        export RUNPOD_API_KEY="$$(cat /run/secrets/runpod.key)"
        exec python app.py

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.17.6
    container_name: open-terminal
    restart: unless-stopped
    env_file:
      - /opt/secrets/webui.env
    environment:
      - OPEN_TERMINAL_OPENCODE_COMMAND=/home/user/.local/bin/opencode
    volumes:
      - /opt/stacks/webui/terminal:/home/user
      # Runtime metadata stays writable in the terminal home; managed files do not.
      - ./opencode/config/opencode.json:/home/user/.config/opencode/opencode.json:ro
      - ./opencode/config/AGENTS.md:/home/user/.config/opencode/AGENTS.md:ro
      - ./opencode/config/agents:/home/user/.config/opencode/agents:ro
      # Only selected files are discovered via config/agents symlinks.
      - /opt/stacks/.opencode/agents:/opt/opencode/agents:ro
      - /opt/stacks/.opencode/session-model-plugin:/opt/opencode/session-model-plugin:ro

  tika:
    image: apache/tika:latest
    container_name: open-webui-tika
    restart: unless-stopped
    # internal only, no port exposed

  mcpo:
    image: ghcr.io/open-webui/mcpo:git-788ff92
    container_name: mcpo
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - /opt/secrets/mcpo-config.json:/app/config.json:ro
      # Read-only: the filesystem MCP only reads; the container must not be
      # able to modify the stacks tree. Write paths, if ever needed, should be
      # added as explicit narrow mounts instead of widening this one.
      - /opt/stacks:/stacks:ro
    command: [ "--config", "/app/config.json", "--port", "8000" ]
    env_file:
      - /opt/secrets/webui.env
      - /opt/secrets/trainlocks.env
    environment:
      - TRILIUM_URL=${TRILIUM_URL}
      - HOME=/tmp
      - TRAINLOGS_USERNAME=${TRAINLOGS_USERNAME}
      - TRAINLOGS_PASSWORD=${TRAINLOGS_PASSWORD}
    networks:
      - default
      - stacks-shared
      - trilium

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Run as the host user (johannes): the image entrypoint force-chowns
    # /etc/searxng to its internal uid 977 on every root startup, which
    # kept reverting the config dir's ownership. As uid 1000 the entrypoint
    # skips the chown (benign ownership warning) and the config dir stays
    # johannes-owned and normally editable.
    user: "1000:1000"
    # Wrapper injects Exa/Scout placeholders into private container settings
    # and exports the signing secret from read-only /run/secrets mounts.
    entrypoint: ["/bin/sh", "/etc/searxng/entrypoint-wrapper.sh"]
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://${LAN_IP}:8081/
      - SEARXNG_VALKEY_URL=valkey://searxng-valkey:6379/0
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    volumes:
      - /opt/stacks/webui/searxng/config:/etc/searxng
      # Keyless-API engine modules (Exa/Tavily/TinyFish) plus the Web Scout
      # engine (Mistral agent via research-search). SearXNG loads an
      # engine module by file name from its package engines/ directory, so
      # the repo files are mounted individually, read-only.
      - /opt/stacks/webui/searxng/engines/exa_keyless.py:/usr/local/searxng/searx/engines/exa_keyless.py:ro
      - /opt/stacks/webui/searxng/engines/tavily_keyless.py:/usr/local/searxng/searx/engines/tavily_keyless.py:ro
      - /opt/stacks/webui/searxng/engines/tinyfish_keyless.py:/usr/local/searxng/searx/engines/tinyfish_keyless.py:ro
      - /opt/stacks/webui/searxng/engines/webscout.py:/usr/local/searxng/searx/engines/webscout.py:ro
      # Read-only source secrets. Wrapper writes Exa/Scout values to private
      # container-local settings and exports the signing secret; none are
      # configured as plaintext Compose environment values.
      - /opt/secrets/exa.key:/run/secrets/exa.key:ro
      - /opt/secrets/research-search.token:/run/secrets/research-search.token:ro
      - /opt/secrets/searxng.secret:/run/secrets/searxng.secret:ro
      # Named (not the image's anonymous volume) so the one-time chown
      # survives container recreates; chowned to 1000 via a one-off root
      # container after creation.
      - searxng-cache:/var/cache/searxng
    # On stacks-shared so other stacks reach the engine directly at
    # http://searxng:8080 (the searxng-mcp tool server and the
    # trade-sentinel news pipeline) instead of the published LAN port.
    networks:
      - default
      - stacks-shared
    depends_on:
      - searxng-valkey

  searxng-valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - searxng-valkey-data:/data
    # internal only — no port exposure needed

  # Audiobookshelf MCP connector (built from ./audiobookshelf-mcp).
  # Speaks authenticated Streamable HTTP for OpenWebUI only. No published port.
  # Podcast write tools are enabled after user-confirmed read-only verification.
  audiobookshelf-mcp:
    build: ./audiobookshelf-mcp
    image: audiobookshelf-mcp:local
    container_name: audiobookshelf-mcp
    restart: unless-stopped
    # Run as the host user (1000:1000) so user-owned secret files
    # can be 0600 instead of world-readable. The image's own default remains
    # 10001:10001 in audiobookshelf-mcp/Dockerfile.
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - ABS_URL=http://audiobookshelf:13378
      - ABS_ALLOWED_LIBRARY_IDS=${ABS_ALLOWED_LIBRARY_IDS:?Set ABS_ALLOWED_LIBRARY_IDS in your local .env}
      - ABS_API_KEY_FILE=/run/secrets/abs_api_key
      - MCP_AUTH_TOKEN_FILE=/run/secrets/mcp_token
      - ABS_ENABLE_PODCAST_WRITES=true
      # Operator assertion only: must match Audiobookshelf's own configured
      # server time zone (verified natively in the ABS container). This is not
      # the connector container's local zone, and it does not change ABS.
      - ABS_SERVER_TIMEZONE=Europe/Vienna
    volumes:
      - /opt/secrets/audiobookshelf-mcp/abs_api_key:/run/secrets/abs_api_key:ro
      - /opt/secrets/audiobookshelf-mcp/mcp_token:/run/secrets/mcp_token:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default
      - audiobookshelf

networks:
  default:
  stacks-shared:
    external: true
  audiobookshelf:
    external: true
    name: audiobookshelf_default
  trilium:
    external: true
    name: trilium_default

volumes:
  searxng-valkey-data:
  searxng-cache:
